name: phase0-spike

on:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: llama.cpp release tag
        default: b11960
  push:
    branches: [main]
    paths:
      - "spike/**"
      - ".github/workflows/phase0-spike.yml"

concurrency:
  group: phase0-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLAMA_TAG: ${{ inputs.llama_tag || 'b11960' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spike/requirements.txt
      - run: pip install -r spike/requirements.txt
      - run: pytest -q spike/tests

  matrix-list:
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: ids
        run: |
          echo "ids=$(python -c 'import json,yaml; print(json.dumps([m["id"] for m in yaml.safe_load(open("spike/models.yaml"))["models"]]))')" >> "$GITHUB_OUTPUT"

  bench:
    needs: matrix-list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.matrix-list.outputs.ids) }}
    env:
      ID: ${{ matrix.id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spike/requirements.txt
      - run: pip install -r spike/requirements.txt

      - name: Download llama.cpp ${{ env.LLAMA_TAG }}
        run: |
          set -euo pipefail
          asset="llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${asset}"
          mkdir -p "$RUNNER_TEMP/llama"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/llama"
          server="$(find "$RUNNER_TEMP/llama" -type f -name llama-server | head -n1)"
          test -n "$server"
          bin="$(dirname "$server")"
          libdirs="$(find "$RUNNER_TEMP/llama" -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          echo "LLAMA_BIN=$bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${libdirs:+$libdirs:}${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          { echo "### llama.cpp ${LLAMA_TAG} binaries (${ID})"; echo '```'; ls -la "$bin"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Fetch and bench
        run: |
          set -euo pipefail
          mkdir -p results
          fetch_rc=0
          python spike/fetch.py "$ID" --dest models > fetch.json || fetch_rc=$?
          if [ "$fetch_rc" -ne 0 ]; then
            case "$fetch_rc" in
              2) status=error; detail="sha256 mismatch" ;;
              3) status=error; detail="no disk" ;;
              4) status=missing_file; detail="unknown id or file missing on HF" ;;
              *) status=error; detail="fetch.py exit $fetch_rc" ;;
            esac
            STATUS="$status" DETAIL="$detail" python - <<'PY'
          import json, os, yaml
          mid = os.environ["ID"]
          cfg = yaml.safe_load(open("spike/models.yaml"))
          modes = next((m.get("modes") or [] for m in cfg["models"] if m["id"] == mid), []) or ["text"]
          with open(f"results/{mid}.jsonl", "w") as f:
              for mode in modes:
                  f.write(json.dumps({
                      "model": mid, "mode": mode, "status": os.environ["STATUS"], "runs": 0,
                      "tok_s": None, "ttft_ms": None, "ttfa_ms": None, "peak_rss_mb": None,
                      "wall_s": None, "detail": os.environ["DETAIL"], "llama_tag": os.environ["LLAMA_TAG"],
                  }) + "\n")
          PY
            exit 0
          fi
          model="$(python -c 'import json; print(json.load(open("fetch.json"))["model_path"])')"
          mmproj="$(python -c 'import json; print(json.load(open("fetch.json"))["mmproj_path"] or "")')"
          args=("$ID" --bin "$LLAMA_BIN" --model "$model" --out "results/$ID.jsonl" --runs 3)
          if [ -n "$mmproj" ]; then args+=(--mmproj "$mmproj"); fi
          python spike/bench.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.id }}
          path: |
            results/*.jsonl
            results/*.wav
            results/*.log
          if-no-files-found: warn

  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - run: mkdir -p results
      - run: python spike/report.py results --out phase0-results.md
      - run: cat phase0-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-report
          path: |
            phase0-results.md
            results/*.wav
          if-no-files-found: warn
